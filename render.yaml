# Blueprint Render: database, API, sito pubblico e admin.
# Uso: dashboard Render → New → Blueprint → seleziona questo repository.
databases:
  - name: cms-test-db
    plan: free
    databaseName: cms
    user: cms

services:
  - type: web
    name: cms-test-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run prisma:generate -w @cms/api && npm run build -w @cms/api
    startCommand: cd apps/api && npx prisma db push --skip-generate && npm run seed && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cms-test-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false

  - type: web
    name: cms-test-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run build -w @cms/web
    startCommand: npm run start -w @cms/web
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        sync: false
      # Indirizzi del pannello che possono aprire l'editor (predefinito nel codice: cms-test-admin.onrender.com)
      - key: ADMIN_ORIGIN
        sync: false

  - type: web
    name: cms-test-admin
    runtime: static
    buildCommand: npm install --include=dev && npm run build:shared && npm run build -w @cms/admin
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
