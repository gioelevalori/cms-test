<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>L'agenda sul bancone</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;background:#3d4a5c;font-family:Georgia,serif;overflow:hidden}
.book{position:absolute;left:60px;top:50px;width:1320px;height:800px;display:grid;grid-template-columns:1fr 1fr;background:#f2efe6;border-radius:8px;box-shadow:0 30px 60px #0006}
.page{padding:44px 52px;border-right:1px solid #d9d3c3;background:repeating-linear-gradient(#f2efe6 0 35px,#d9e2ec 35px 36px)}
.date{font:700 15px Arial;letter-spacing:.12em;color:#b0302a;text-transform:uppercase}h1{font-size:44px;margin:8px 0 24px}
.hand{font:24px 'Comic Sans MS',cursive;color:#1d3a8a;line-height:36px}.strike{text-decoration:line-through;color:#b0302a}
.ribbon{position:absolute;left:655px;top:-10px;width:22px;height:340px;background:#b0302a}
.tab{display:flex;gap:8px;margin-top:24px}.tab span{font:700 14px Arial;padding:6px 10px;background:#e2dccb;border-radius:4px 4px 0 0}
.row{display:flex;justify-content:space-between;font:20px Arial;line-height:36px}
.compose{margin-top:30px;padding:14px 18px;border:2px dashed #1d3a8a;border-radius:10px;font:20px 'Comic Sans MS',cursive;color:#1d3a8a99}
</style></head><body><div class="book"><div class="ribbon"></div>
<div class="page"><div class="date">Mercoledì 28 ottobre</div><h1>Salone Giulia</h1>
<div class="hand">Sabato chiudiamo alle 15<br><span class="strike">Piega 22 €</span> → Piega 25 €<br>Venerdì: corso colore</div>
<div class="compose">Scrivi nell'agenda…</div>
<div class="tab"><span>Pizzeria</span><span>Salone</span><span>Ferramenta</span><span>Studio</span></div></div>
<div class="page"><div class="date">Il sito oggi</div><h1>Servizi e orari</h1>
<div class="row"><span>Taglio donna</span><span>35,00 €</span></div><div class="row"><span>Piega</span><span>25,00 €</span></div><div class="row"><span>Colore</span><span>55,00 €</span></div><div class="row"><span>lunedì</span><span>chiuso</span></div><div class="row"><span>mar – sab</span><span>9:00–19:00</span></div></div>
</div></body></html>
