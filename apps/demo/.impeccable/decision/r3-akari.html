<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Lanterne</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;background:#1d1b19;font-family:Segoe UI,sans-serif;color:#efe6d2;overflow:hidden}
.lamp{position:absolute;border-radius:44% 44% 40% 40%;display:grid;place-items:center;text-align:center;color:#2b241c;font-weight:600}
.on{background:radial-gradient(circle at 50% 45%,#fff6dd,#f0dcae 60%,#c9a86a);box-shadow:0 0 80px #f0d29a88}
.off{background:#3a352f;color:#8a8070}
.lamp small{display:block;font-weight:400;font-size:14px}
h1{position:absolute;left:70px;top:60px;font-weight:300;font-size:52px;margin:0;max-width:600px}
.stamp{color:#d23c25}
.chat{position:absolute;left:70px;bottom:70px;width:540px;background:#efe6d2;color:#2b241c;border-radius:6px;padding:20px;font-size:19px}
</style></head><body><h1>Accendi il sito della tua attività <span class="stamp">con un messaggio</span>.</h1>
<div class="lamp on" style="left:760px;top:120px;width:240px;height:300px">Pizzeria da Mario<small>aperto 19–23</small></div>
<div class="lamp on" style="left:1050px;top:200px;width:260px;height:340px">Salone Giulia<small>Piega 25 €</small></div>
<div class="lamp off" style="left:800px;top:480px;width:200px;height:250px">Ferramenta<small>chiuso oggi</small></div>
<div class="lamp on" style="left:1080px;top:580px;width:180px;height:220px">Studio<small>9–18</small></div>
<div class="chat">Salone Giulia › La piega costa 25 euro<br><b>Conferma</b> · Annulla</div>
</body></html>
