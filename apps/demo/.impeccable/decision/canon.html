<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Standard</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;background:#f8fafc;font-family:system-ui,Segoe UI,sans-serif;color:#0f172a;overflow:hidden}
nav{height:64px;border-bottom:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;padding:0 48px;font-weight:700}
.wrap{display:grid;grid-template-columns:440px 1fr;gap:32px;padding:40px 48px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;height:740px}
h2{margin:0 0 8px;font-size:28px}.muted{color:#64748b}
.bub{background:#dcfce7;border-radius:12px;padding:12px 14px;margin:18px 0 0 auto;width:70%}
.reply{background:#f1f5f9;border-radius:12px;padding:12px 14px;margin-top:12px;width:85%}
.btn{display:inline-block;background:#16a34a;color:#fff;border-radius:8px;padding:8px 16px;margin-top:10px}
.site h1{font-size:44px;margin:30px 0 6px}.blk{height:90px;background:#f1f5f9;border-radius:10px;margin-top:18px}
</style></head><body><nav>cms-test</nav><div class="wrap">
<div class="card"><h2>Aggiorna il sito da WhatsApp</h2><div class="muted">Scrivi cosa cambia, conferma, fatto.</div>
<div class="bub">Sabato chiudiamo alle 15</div><div class="reply">Sabato 31 ottobre: 12:00–15:00<br><span class="btn">Conferma</span></div></div>
<div class="card site"><div class="muted">pizzeriadamario.it</div><h1>Pizzeria da Mario</h1><div class="muted">Oggi aperto 19:00–23:30</div><div class="blk"></div><div class="blk"></div><div class="blk"></div></div>
</div></body></html>
