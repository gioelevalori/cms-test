name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cms:cms@localhost:5432/cms
      JWT_SECRET: ci-secret
      API_URL: http://localhost:3000
      WHATSAPP_TOKEN: test-token
      WHATSAPP_PHONE_NUMBER_ID: test-phone-id
      WHATSAPP_APP_SECRET: ci-app-secret
      WHATSAPP_VERIFY_TOKEN: ci-verify
      WHATSAPP_DISPLAY_NUMBER: '+1 555 123 4567'
      WHATSAPP_API_BASE: http://localhost:3999
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa dipendenze
        run: scripts/ci-run.sh install npm install --no-audit --no-fund

      - name: Pacchetto condiviso — build e test
        run: |
          scripts/ci-run.sh shared-build npm run build -w @cms/shared
          scripts/ci-run.sh shared-test npm test -w @cms/shared

      - name: API — prisma, typecheck, build
        working-directory: apps/api
        run: |
          ../../scripts/ci-run.sh prisma-generate npx prisma generate
          ../../scripts/ci-run.sh api-typecheck npm run typecheck
          ../../scripts/ci-run.sh api-build npm run build

      - name: Admin — typecheck e build
        run: scripts/ci-run.sh admin-build npm run build -w @cms/admin

      - name: Sito pubblico — build
        run: scripts/ci-run.sh web-build npm run build -w @cms/web

      - name: Database — schema e dati di esempio
        working-directory: apps/api
        run: |
          ../../scripts/ci-run.sh db-push npx prisma db push --skip-generate
          ../../scripts/ci-run.sh seed npm run seed

      - name: Avvia API e sito
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          (cd apps/web && npx next start -p 3001 > ../../web.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf http://localhost:3000/health > /dev/null && break; sleep 1; done
          for i in $(seq 1 40); do curl -sf http://localhost:3001/pizzeria-da-mario > /dev/null && break; sleep 1; done

      - name: Test end-to-end API
        run: scripts/ci-run.sh e2e npm run e2e -w @cms/api

      - name: Test affidabilità WhatsApp e concorrenza
        run: scripts/ci-run.sh reliability npm run test:reliability -w @cms/api

      - name: Test del sito pubblico
        run: |
          html=$(curl -sf http://localhost:3001/pizzeria-da-mario)
          echo "$html" | grep -q "Pizzeria da Mario"
          echo "$html" | grep -q 'application/ld+json'
          echo "$html" | grep -q "Margherita"
          echo "Sito pubblico OK"

      - name: Log in caso di errore
        if: failure()
        run: |
          for f in api.log web.log; do
            [ -f "$f" ] && echo "::error title=$f::$(tail -n 40 $f | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          done
          true
